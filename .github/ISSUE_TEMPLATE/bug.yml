name: Bug Report
description: File a bug report for ContextLion
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: url
    attributes:
      label: Webpage URL
      description: What webpage were you attempting to extract?
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have been extracted?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred (e.g. error message, missing content)?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & Version
      placeholder: Chrome 138, Edge 138, Firefox 135
    validations:
      required: true
