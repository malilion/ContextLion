name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm format -- --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm compile

      - name: Unit Tests
        run: pnpm test

      - name: Build Extensions
        run: |
          pnpm build
          pnpm build:firefox
