<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#312e81" stroke-width="8"/>

  <!-- Glowing Lion & Context Mark -->
  <g filter="url(#glow)">
    <!-- Lion Mane / Context Document Shape -->
    <path d="M160 144 C160 120 180 100 204 100 L320 100 L400 180 L400 376 C400 400 380 420 356 420 L160 420 Z" fill="#1e1b4b" opacity="0.6"/>
    
    <!-- Stylized Lion Face Profile & AI Context Nodes -->
    <!-- Mane Rays -->
    <path d="M256 120 L276 168 L328 152 L312 200 L360 212 L320 248 L356 288 L304 296 L320 348 L272 332 L256 384 L240 332 L192 348 L208 296 L156 288 L192 248 L152 212 L200 200 L184 152 L236 168 Z" fill="url(#goldGrad)"/>
    
    <!-- Lion Face Silhouette Overlay -->
    <polygon points="256,170 300,240 280,310 256,330 232,310 212,240" fill="#0f172a"/>

    <!-- Eyes (Amber glowing points) -->
    <polygon points="234,235 246,242 236,246" fill="#fbbf24"/>
    <polygon points="278,235 266,242 276,246" fill="#fbbf24"/>

    <!-- Nose & Muzzle -->
    <polygon points="256,268 266,282 246,282" fill="#f59e0b"/>
    <line x1="256" y1="282" x2="256" y2="298" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M244 298 C250 304 262 304 268 298" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Subtle AI Binary / Context Accent Bars -->
    <rect x="228" y="356" width="56" height="6" rx="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="240" y="370" width="32" height="6" rx="3" fill="#fbbf24" opacity="0.5"/>
  </g>
</svg>
